<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Live2D Avatar Studio</title>
    <meta name="description" content="Live2Dモデルを使ったリアルタイムVTuberアバタースタジオ。">
    <link rel="stylesheet" href="live2d-styles.css?v=1.3">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- 音声ロック解除用警告バナー（移動済み） -->
        <div class="avatar-viewport" id="avatar-viewport">
            <div class="background-layer" id="background-layer"></div>
            <div class="stream-clock" id="stream-clock" style="display:none;">00:00</div>
            <div class="stream-stats" id="stream-stats" style="display:none;">
                <div class="stat-item"><span class="stat-icon">👤</span><span id="stat-subscribers">-</span></div>
                <div class="stat-item"><span class="stat-icon">👁️</span><span id="stat-viewers">-</span></div>
                <div class="stat-item"><span class="stat-icon">💬</span><span id="stat-comments">0</span></div>
            </div>
            <canvas id="live2d-canvas"></canvas>
            <div class="comment-viewer" id="comment-viewer"></div>
            <div class="camera-preview-container" id="camera-preview-container">
                <video id="webcam" autoplay playsinline></video>
                <div class="camera-label">Webcam</div>
            </div>
            <div class="loading-overlay" id="loading-overlay">
                <div class="spinner"></div>
                <p id="loading-text">Live2Dモデルを読み込み中...</p>
            </div>
            <!-- 配信オーバーレイ -->
            <div class="overlay-screen" id="stream-overlay"></div>
        </div>
    </div>
    <!-- PixiJS v6 -->
    <script src="pixi.min.js"></script>
    <!-- Cubism 4 Core (ローカルコピー) -->
    <script src="live2dcubismcore.min.js"></script>
    <!-- pixi-live2d-display v0.4 -->
    <script src="pixi-live2d-display.min.js"></script>
    <!-- OBS WebSocket JS v5 -->
    <script src="https://cdn.jsdelivr.net/npm/obs-websocket-js@5.0.3/dist/obs-ws.min.js"></script>
    <script type="module" src="/live2d-app.js"></script>
</body>
</html>
