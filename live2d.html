<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Live2D Avatar Studio</title>
    <meta name="description" content="Live2Dモデルを使ったリアルタイムVTuberアバタースタジオ。">
    <link rel="stylesheet" href="live2d-styles.css?v=2.7">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;500;700&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    <script>
        (function () {
            function sendLogToServer(level, args) {
                try {
                    const message = args.map(arg => {
                        if (arg instanceof Error) return arg.stack || arg.message;
                        return typeof arg === 'object' ? JSON.stringify(arg) : String(arg);
                    }).join(' ').trim();
                    if (!message || message.includes("[CSM]") || message.includes("Google Identity Services loaded") || message.includes("Model positioned:")) return;
                    const timestamp = new Date().toISOString();
                    const logString = `[${timestamp}] [${level.toUpperCase()}] ${message}`;
                    if (navigator.sendBeacon) {
                        navigator.sendBeacon('/log', new Blob([JSON.stringify({ message: logString })], { type: 'application/json' }));
                    } else {
                        fetch('/log', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ message: logString })
                        }).catch(() => { });
                    }
                } catch (e) { }
            }

            const originalLog = console.log;
            const originalWarn = console.warn;
            const originalError = console.error;

            console.log = function (...args) {
                originalLog.apply(console, args);
                sendLogToServer('log', args);
            };
            console.warn = function (...args) {
                originalWarn.apply(console, args);
                sendLogToServer('warn', args);
            };
            console.error = function (...args) {
                originalError.apply(console, args);
                sendLogToServer('error', args);
            };
        })();

        // =====================================================================
        // UIイベント重複防止＆モジュール登録エンジン
        // =====================================================================
        window._uiLoadedHandlers = window._uiLoadedHandlers || new Map();
        window.onUILoaded = function (moduleId, handler) {
            window._uiLoadedHandlers.set(moduleId, handler);
        };
        window.addEventListener("uiLoaded", () => {
            window._uiLoadedHandlers.forEach((handler, id) => {
                try {
                    handler();
                } catch (e) {
                    console.error(`[UILoaded Error: ${id}]`, e);
                }
            });
        });
    </script>
</head>

<body>
    <div class="app-container">
        <!-- 音声ロック解除用警告バナー（移動済み） -->
        <div class="avatar-viewport" id="avatar-viewport">
            <div class="background-layer" id="background-layer"></div>
            <div class="stream-clock" id="stream-clock" style="display:none;">00:00</div>
            <div class="stream-stats" id="stream-stats" style="display:none;">
                <div class="stat-item"><span class="stat-icon">👤</span><span id="stat-subscribers">-</span></div>
                <div class="stat-item"><span class="stat-icon">👁️</span><span id="stat-viewers">-</span></div>
                <div class="stat-item"><span class="stat-icon">💬</span><span id="stat-comments">0</span></div>
            </div>
            <!-- ニュースボード -->
            <div class="news-board" id="news-board">
                <div class="news-header">
                    <div class="news-header-left">
                        <span class="news-icon">📰</span>
                        <span class="news-title-text" id="news-board-category">最新ニュース</span>
                    </div>
                    <span class="news-progress-badge" id="news-board-progress" style="display:none;">1 / 1</span>
                </div>
                <div class="news-content">
                    <h3 id="news-article-title">ニュースのタイトルがここに入ります</h3>
                    <p id="news-article-desc">ニュースの本文抜粋がここに入ります。少し長めのテキストでもスクロール可能なように設計されています。</p>
                </div>
                <div class="news-footer" id="news-article-date">
                    2026/08/15 12:00
                </div>
            </div>
            <!-- セットリスト風 ニュースカテゴリアジェンダボード -->
            <div class="news-setlist-board" id="news-setlist-board" style="display:none;">
                <div class="setlist-header">
                    <div class="setlist-header-left">
                        <span class="setlist-icon">📋</span>
                        <span class="setlist-title">TODAY'S TOPICS</span>
                    </div>
                    <span class="setlist-badge" id="setlist-progress-badge">0 / 0</span>
                </div>
                <div class="setlist-category-list" id="setlist-category-list">
                    <!-- 動的にカテゴリ一覧が挿入されます -->
                </div>
            </div>
            <canvas id="live2d-canvas"></canvas>
            <!-- HTMLオーバーレイ群: Chrome GPU合成ちらつき防止のため独立レイヤー化 -->
            <div id="html-overlay-wrapper" style="position:absolute;inset:0;pointer-events:none;will-change:transform;transform:translateZ(0);z-index:3;">
                <!-- リアルタイム字幕テロップ（ドラッグ＆ドロップ可能） -->
                <div class="avatar-subtitles" id="avatar-subtitles" style="display:none;pointer-events:auto;">
                    <div class="subtitles-drag-handle" id="subtitles-drag-handle" title="ドラッグして字幕の位置を移動できます">⋮⋮</div>
                    <div class="subtitles-text" id="avatar-subtitles-text"></div>
                </div>
                <div class="comment-viewer" id="comment-viewer" style="pointer-events:auto;"></div>
                <div class="camera-preview-container" id="camera-preview-container" style="pointer-events:auto;">
                    <video id="webcam" autoplay playsinline></video>
                    <div class="camera-label">Webcam</div>
                </div>
                <div class="loading-overlay" id="loading-overlay" style="pointer-events:auto;">
                    <div class="spinner"></div>
                    <p id="loading-text">Live2Dモデルを読み込み中...</p>
                </div>
                <!-- 配信オーバーレイ -->
                <div class="overlay-screen" id="stream-overlay" style="pointer-events:auto;"></div>
            </div>
        </div>
    </div>
    <!-- PixiJS v6 -->
    <script src="pixi.min.js"></script>
    <!-- Cubism 4 Core (ローカルコピー) -->
    <script src="live2dcubismcore.min.js"></script>
    <!-- pixi-live2d-display v0.4 -->
    <script src="pixi-live2d-display.min.js"></script>
    <!-- OBS WebSocket JS v5 -->
    <script src="https://cdn.jsdelivr.net/npm/obs-websocket-js@5.0.3/dist/obs-ws.min.js"></script>
    <!-- UI Overlay and Features -->
    <script src="js/draggable.js?v=4.2"></script>
    <!-- Extracted Modules -->
    <script src="js/audio-voicevox.js?v=4.6"></script>
    <script src="js/bgm-player.js?v=4.5"></script>
    <script src="js/ai-settings.js?v=4.5"></script>
    <script src="js/ui-tabs.js?v=4.5"></script>
    <script src="js/ui-state-autosave.js?v=4.5"></script>
    <script src="js/idle-speech.js?v=4.5"></script>
    <script src="js/chat-ui.js?v=4.5"></script>
    <script src="js/chat-client.js?v=4.5"></script>
    <script src="js/stream-automation.js?v=4.5"></script>
    <script src="js/news-mode.js?v=5.0"></script>
    <script src="js/radio-mode.js?v=4.5"></script>
    <script src="js/stream-tools.js?v=4.5"></script>
    <script src="js/stream-wizard.js?v=4.5"></script>
    <script src="js/obs-websocket.js?v=4.5"></script>
    <script src="js/screen-overlay.js?v=4.5"></script>
    <script src="js/tracking-camera.js?v=4.5"></script>
    <script src="js/avatar-features.js?v=4.5"></script>
    <script src="js/reaction-effects.js?v=4.5"></script>
    <script src="js/layout-manager.js?v=4.5"></script>
    <script src="js/hot-reload.js?v=4.5"></script>
    <script type="module" src="/live2d-app.js?v=4.5"></script>
</body>

</html>
