<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 サムネイルエディタ - VStudio</title>
    <link rel="stylesheet" href="/css/live2d-styles.css?v=23.0">
    <style>
        :root {
            --bg-dark: #0f111a;
            --panel-bg: rgba(22, 27, 46, 0.95);
            --border-color: rgba(0, 210, 211, 0.3);
            --primary: #00d2d3;
            --accent: #ff7675;
            --text-main: #ffffff;
            --text-muted: #a4b0be;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* ヘッダー */
        .editor-header {
            height: 52px;
            background: rgba(15, 17, 26, 0.95);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .editor-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        .editor-title span.badge {
            font-size: 0.72rem;
            padding: 2px 8px;
            background: rgba(0, 210, 211, 0.15);
            border: 1px solid var(--primary);
            border-radius: 12px;
            color: var(--primary);
        }

        /* メインコンテナ */
        .editor-body {
            flex: 1;
            display: flex;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* 左側：プレビューキャンバス */
        .preview-pane {
            flex: 1.35;
            background: #08090f;
            display: flex;
            flex-direction: column;
            padding: 16px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .preview-container {
            flex: 1;
            background: #000;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        #thumb-preview-canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .preview-status-bar {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        /* 右側：設定パネル */
        .controls-pane {
            width: 380px;
            background: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow: hidden;
            flex-shrink: 0;
        }

        .controls-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-sizing: border-box;
        }

        /* グループカード */
        .control-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
        }

        .control-card-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--primary);
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-row {
            margin-bottom: 8px;
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        .form-label {
            font-size: 0.76rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: block;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 7px 10px;
            border-radius: 5px;
            border: 1px solid rgba(0, 210, 211, 0.35);
            background: #121626;
            color: #fff;
            font-size: 0.82rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(0, 210, 211, 0.3);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* スイッチトグル */
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            margin-bottom: 6px;
        }

        /* ボタン共通 */
        .action-btn {
            background: rgba(0, 210, 211, 0.15);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .action-btn:hover {
            background: var(--primary);
            color: #000;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 210, 211, 0.4);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .action-btn.primary {
            background: var(--primary);
            color: #000;
        }

        .action-btn.primary:hover {
            background: #00e5e6;
            box-shadow: 0 4px 16px rgba(0, 210, 211, 0.6);
        }

        .action-btn.danger {
            background: rgba(255, 118, 117, 0.15);
            border-color: var(--accent);
            color: var(--accent);
        }

        .action-btn.danger:hover {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px rgba(255, 118, 117, 0.4);
        }

        /* フッター固定アクション */
        .controls-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            background: rgba(15, 17, 26, 0.98);
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        /* フィードバック通知 */
        #yt-api-feedback {
            font-size: 0.75rem;
            padding: 6px 10px;
            border-radius: 4px;
            display: none;
            text-align: center;
        }
        #yt-api-feedback.success {
            display: block;
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid #2ecc71;
            color: #2ecc71;
        }
        #yt-api-feedback.error {
            display: block;
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <!-- ヘッダー -->
    <header class="editor-header">
        <div class="editor-title">
            <span>🎨 サムネイルエディタ</span>
            <span class="badge" id="canvas-size-badge">1280 × 720</span>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="action-btn" id="btn-sync-from-main" style="font-size: 0.76rem; padding: 5px 10px;">
                🔄 タイトル・ポーズを再同期
            </button>
            <button class="action-btn danger" id="btn-close-window" style="font-size: 0.76rem; padding: 5px 10px;">
                ✕ 閉じる
            </button>
        </div>
    </header>

    <!-- メインボディ -->
    <div class="editor-body">
        <!-- プレビュー領域 -->
        <main class="preview-pane">
            <div class="preview-container">
                <canvas id="thumb-preview-canvas" width="1280" height="720"></canvas>
            </div>
            <div class="preview-status-bar">
                <span id="canvas-status-text">✅ リアルタイム自動保存が有効です</span>
                <span id="canvas-ratio-text">アスペクト比 16:9</span>
            </div>
        </main>

        <!-- 設定パネル -->
        <aside class="controls-pane">
            <div class="controls-scroll">
                <!-- 1. キャンバスサイズ -->
                <div class="control-card">
                    <div class="control-card-title">📐 画像サイズ・用途</div>
                    <select id="thumb-size-select">
                        <option value="youtube">YouTube (1280 × 720 / 16:9)</option>
                        <option value="tiktok">TikTok・Shorts (1080 × 1920 / 9:16)</option>
                        <option value="square">正方形 (1080 × 1080 / 1:1)</option>
                    </select>
                </div>

                <!-- 2. 表示・非表示トグル -->
                <div class="control-card">
                    <div class="control-card-title">👁️ 表示項目</div>
                    <div class="toggle-row">
                        <span>背景画像</span>
                        <input type="checkbox" id="thumb-show-bg" checked>
                    </div>
                    <div class="toggle-row">
                        <span>アバター</span>
                        <input type="checkbox" id="thumb-show-avatar" checked>
                    </div>
                    <div class="toggle-row">
                        <span>メインタイトル</span>
                        <input type="checkbox" id="thumb-show-title" checked>
                    </div>
                    <div class="toggle-row">
                        <span>サブテキスト（概要文）</span>
                        <input type="checkbox" id="thumb-show-desc" checked>
                    </div>
                </div>

                <!-- 3. 背景設定 -->
                <div class="control-card">
                    <div class="control-card-title">🖼️ 背景</div>
                    <div class="form-row">
                        <textarea id="thumb-ai-bg-prompt" rows="2" placeholder="例: サイバーパンクなVTuber配信スタジオ、ネオンブルー"></textarea>
                    </div>
                    <div class="form-row" style="display: flex; gap: 6px;">
                        <button class="action-btn" id="thumb-ai-bg-generate-btn" style="flex: 1; font-size: 0.78rem;">
                            ✨ 背景をAI生成
                        </button>
                    </div>
                    <div id="thumb-ai-bg-status" style="font-size: 0.72rem; color: var(--text-muted); text-align: center; margin-top: 4px;"></div>
                </div>

                <!-- 4. アバター調整 -->
                <div class="control-card">
                    <div class="control-card-title">🎙️ アバター調整</div>
                    <div class="form-row">
                        <label class="form-label">拡大率: <span id="label-avatar-scale">100%</span></label>
                        <input type="range" id="thumb-avatar-scale" min="10" max="250" value="100">
                    </div>
                    <div class="form-row">
                        <label class="form-label">位置 (横 X): <span id="label-avatar-x">100%</span></label>
                        <input type="range" id="thumb-avatar-x" min="-50" max="150" value="100">
                    </div>
                    <div class="form-row">
                        <label class="form-label">位置 (縦 Y): <span id="label-avatar-y">100%</span></label>
                        <input type="range" id="thumb-avatar-y" min="-50" max="150" value="100">
                    </div>
                    <div class="form-row" style="margin-top: 8px;">
                        <button class="action-btn" id="thumb-recapture-btn" style="width: 100%; font-size: 0.78rem;">
                            📸 スタジオのアバターを最新ポーズで再取得
                        </button>
                    </div>
                </div>

                <!-- 5. タイトル設定 -->
                <div class="control-card">
                    <div class="control-card-title">📝 タイトルテキスト</div>
                    <div class="form-row">
                        <textarea id="thumb-edit-title" rows="2" placeholder="サムネイル用タイトルを入力"></textarea>
                    </div>
                    <div class="form-row" style="display: flex; gap: 10px;">
                        <div style="flex: 1;">
                            <label class="form-label">文字色</label>
                            <input type="color" id="thumb-title-color" value="#ffffff" style="width: 100%; height: 28px; padding: 0; cursor: pointer;">
                        </div>
                        <div style="flex: 1;">
                            <label class="form-label">縁取り色</label>
                            <input type="color" id="thumb-title-stroke" value="#000000" style="width: 100%; height: 28px; padding: 0; cursor: pointer;">
                        </div>
                    </div>
                    <div class="form-row">
                        <label class="form-label">サイズ: <span id="label-title-size">72px</span></label>
                        <input type="range" id="thumb-title-size" min="20" max="200" value="72">
                    </div>
                    <div class="form-row">
                        <label class="form-label">位置 (横 X): <span id="label-title-x">10%</span></label>
                        <input type="range" id="thumb-title-x" min="0" max="100" value="10">
                    </div>
                    <div class="form-row">
                        <label class="form-label">位置 (縦 Y): <span id="label-title-y">15%</span></label>
                        <input type="range" id="thumb-title-y" min="0" max="100" value="15">
                    </div>
                </div>

                <!-- 6. サブテキスト設定 -->
                <div class="control-card">
                    <div class="control-card-title">💬 サブテキスト</div>
                    <div class="form-row">
                        <textarea id="thumb-edit-desc" rows="2" placeholder="例: 最新ニュース速報＆解説"></textarea>
                    </div>
                    <div class="form-row" style="display: flex; gap: 10px;">
                        <div style="flex: 1;">
                            <label class="form-label">文字色</label>
                            <input type="color" id="thumb-desc-color" value="#f0f0f0" style="width: 100%; height: 28px; padding: 0; cursor: pointer;">
                        </div>
                        <div style="flex: 1;">
                            <label class="form-label">縁取り色</label>
                            <input type="color" id="thumb-desc-stroke" value="#000000" style="width: 100%; height: 28px; padding: 0; cursor: pointer;">
                        </div>
                    </div>
                    <div class="form-row">
                        <label class="form-label">サイズ: <span id="label-desc-size">40px</span></label>
                        <input type="range" id="thumb-desc-size" min="10" max="150" value="40">
                    </div>
                    <div class="form-row">
                        <label class="form-label">位置 (横 X): <span id="label-desc-x">10%</span></label>
                        <input type="range" id="thumb-desc-x" min="0" max="100" value="10">
                    </div>
                    <div class="form-row">
                        <label class="form-label">位置 (縦 Y): <span id="label-desc-y">80%</span></label>
                        <input type="range" id="thumb-desc-y" min="0" max="100" value="80">
                    </div>
                </div>
            </div>

            <!-- フッター操作エリア -->
            <div class="controls-footer">
                <div class="form-row" style="margin-bottom: 4px;">
                    <input type="text" id="thumb-filename-input" placeholder="保存ファイル名 (例: 20261028_朝ニュース)">
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="action-btn primary" id="thumb-download-btn" style="flex: 1;">
                        💾 画像を保存
                    </button>
                    <button class="action-btn" id="btn-upload-to-youtube" style="flex: 1.2; background: rgba(255, 0, 0, 0.2); border-color: #ff4757; color: #ff6b81;">
                        🚀 YouTube枠に送信
                    </button>
                </div>
                <div id="yt-api-feedback"></div>
            </div>
        </aside>
    </div>

    <!-- 専用スクリプト -->
    <script src="/js/thumbnail-editor.js?v=1.0"></script>
</body>
</html>
