<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📰 取得済みのニュース一覧</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0f121d;
            --bg-card: #181d2c;
            --bg-card-hover: #22293d;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(0, 210, 211, 0.4);
            --text-main: #f1f2f6;
            --text-muted: #8b949e;
            --accent-green: #00e676;
            --accent-blue: #00d2d3;
            --accent-orange: #ff9f43;
            --accent-pink: #ff6b81;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px 20px;
            overflow-y: auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: rgba(15, 18, 29, 0.96);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stats-badge {
            background: rgba(0, 210, 211, 0.15);
            color: #81ecec;
            border: 1px solid rgba(0, 210, 211, 0.35);
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: #e2e8f0;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }

        .action-btn:hover,
        .action-btn:focus,
        .action-btn:focus-visible {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.35);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            transform: translateY(-1px);
            outline: none;
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .action-btn.jump-btn {
            background: linear-gradient(135deg, #00e676, #00b894);
            color: #051a10;
            border: none;
            box-shadow: 0 2px 10px rgba(0, 230, 118, 0.35);
        }

        .action-btn.jump-btn:hover,
        .action-btn.jump-btn:focus,
        .action-btn.jump-btn:focus-visible {
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(0, 230, 118, 0.6);
            outline: none;
        }

        #open-cache-btn:hover,
        #open-cache-btn:focus,
        #open-cache-btn:focus-visible {
            border-color: #00f3ff;
            color: #ffffff;
            box-shadow: 0 2px 14px rgba(0, 210, 211, 0.5);
            transform: translateY(-1px);
            outline: none;
        }

        #news-list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 20px;
        }

        .news-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 16px;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .news-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .news-card.is-playing {
            border-color: var(--accent-green);
            background: linear-gradient(135deg, rgba(0, 230, 118, 0.12) 0%, rgba(24, 29, 44, 0.95) 100%);
            box-shadow: 0 0 16px rgba(0, 230, 118, 0.3);
        }

        .news-card.is-read {
            opacity: 0.65;
        }

        .news-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .card-tags {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cat-badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 5px;
            color: #fff;
            background: #485460;
        }

        .cat-cat_top { background: linear-gradient(135deg, #e84118, #c23616); }
        .cat-cat_society { background: linear-gradient(135deg, #0097e6, #00a8ff); }
        .cat-cat_world { background: linear-gradient(135deg, #8c7ae6, #9c88ff); }
        .cat-cat_business { background: linear-gradient(135deg, #44bd32, #4cd137); }
        .cat-cat_politics { background: linear-gradient(135deg, #e1b12c, #fbc531); color: #000; }
        .cat-cat_entertainment { background: linear-gradient(135deg, #e84393, #fd79a8); }
        .cat-cat_sports { background: linear-gradient(135deg, #e67e22, #f39c12); }
        .cat-cat_tech { background: linear-gradient(135deg, #00cec9, #81ecec); color: #000; }
        .cat-cat_science { background: linear-gradient(135deg, #16a085, #1abc9c); }
        .cat-cat_local { background: linear-gradient(135deg, #7f8c8d, #95a5a6); }

        .playing-badge {
            background: #00e676;
            color: #000;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            animation: blink 1.2s infinite;
        }

        .preloaded-badge {
            background: rgba(0, 210, 211, 0.18);
            color: #81ecec;
            border: 1px solid rgba(0, 210, 211, 0.45);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            box-shadow: 0 0 8px rgba(0, 210, 211, 0.25);
        }

        .generating-badge {
            background: rgba(255, 177, 66, 0.18);
            color: #ff9f43;
            border: 1px solid rgba(255, 177, 66, 0.5);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            animation: blink 1.2s infinite;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .news-card.is-preloaded {
            border-color: rgba(0, 210, 211, 0.3);
            background: linear-gradient(135deg, rgba(0, 210, 211, 0.04) 0%, rgba(24, 29, 44, 0.95) 100%);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .read-status {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .start-here-btn {
            background: linear-gradient(135deg, rgba(0, 210, 211, 0.15), rgba(0, 168, 255, 0.15));
            border: 1px solid rgba(0, 210, 211, 0.4);
            color: #81ecec;
            border-radius: 6px;
            padding: 3px 9px;
            font-size: 0.73rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
        }

        .start-here-btn:hover,
        .start-here-btn:focus,
        .start-here-btn:focus-visible {
            background: linear-gradient(135deg, #00d2d3, #00b894);
            color: #051a10;
            border-color: #00d2d3;
            box-shadow: 0 2px 12px rgba(0, 210, 211, 0.55);
            transform: translateY(-1px);
            outline: none;
        }

        .start-here-btn:active {
            transform: translateY(0);
        }

        /* ── カード内キャッシュボタン（共通エフェクト完備） ── */
        .card-cache-btn {
            background: rgba(0, 210, 211, 0.12);
            border: 1px solid rgba(0, 210, 211, 0.35);
            color: #00f3ff;
            border-radius: 5px;
            padding: 3px 9px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            outline: none;
            user-select: none;
        }

        .card-cache-btn:hover,
        .card-cache-btn:focus,
        .card-cache-btn:focus-visible {
            background: linear-gradient(135deg, rgba(0, 210, 211, 0.3), rgba(165, 94, 234, 0.35));
            border-color: #00f3ff;
            color: #ffffff;
            box-shadow: 0 2px 12px rgba(0, 210, 211, 0.5);
            transform: translateY(-1px);
            outline: none;
        }

        .card-cache-btn:active {
            transform: translateY(0);
            box-shadow: 0 1px 4px rgba(0, 210, 211, 0.3);
        }

        .news-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.45;
            margin-bottom: 6px;
        }

        .news-desc {
            font-size: 0.82rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .news-link {
            color: #00d2d3;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: color 0.15s;
        }

        .news-link:hover {
            color: #81ecec;
            text-decoration: underline;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .empty-title {
            font-size: 1.1rem;
            color: #e2e8f0;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .empty-desc {
            font-size: 0.85rem;
            line-height: 1.6;
        }

        @keyframes focusPulse {
            0% { transform: scale(1); box-shadow: 0 0 16px rgba(0, 230, 118, 0.4); }
            50% { transform: scale(1.02); box-shadow: 0 0 24px rgba(0, 230, 118, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 16px rgba(0, 230, 118, 0.4); }
        }

        .pulse-active {
            animation: focusPulse 0.8s ease;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        ::-webkit-scrollbar-thumb { background: #2a3144; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3c4660; }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <h3>📰 取得済みのニュース一覧</h3>
            <span class="stats-badge" id="news-count-badge">0 件</span>
        </div>
        <div class="header-actions">
            <button class="action-btn" id="clear-read-btn" onclick="handleClearReadTitles()" style="background: rgba(255, 118, 117, 0.18); border-color: rgba(255, 118, 117, 0.45); color: #ff7675;" title="既読フラグをすべてクリアして全件未読に戻します">
                🗑️ 既読クリア
            </button>
            <button class="action-btn" id="open-cache-btn" onclick="handleOpenCacheViewer()" style="background: linear-gradient(135deg, rgba(0, 210, 211, 0.2), rgba(165, 94, 234, 0.25)); border-color: rgba(0, 210, 211, 0.4); color: #00f3ff;" title="ニュース原稿キャッシュマネージャーを開く">
                🗄️ キャッシュ確認
            </button>
            <button class="action-btn jump-btn" id="jump-to-current-btn" onclick="scrollToPlayingNews(true)">
                🎯 放送中へジャンプ
            </button>
            <button class="action-btn" id="restore-btn" onclick="handleRestoreClick(this)" title="配信中の番組リストまたは直近の取得データを100%同期・復元します">
                🔄 リスト復元
            </button>
        </div>
    </header>

    <!-- 📦 自律先読みバッファ（常時先行プール）＆事前生成ステータスバー -->
    <div id="prefetch-buffer-panel" style="background: rgba(16, 24, 40, 0.85); border: 1px solid rgba(0, 210, 211, 0.35); border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 14px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);">
        <div style="flex: 1; min-width: 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span id="prefetch-buffer-label" style="font-size: 0.84rem; font-weight: 700; color: #00f3ff; display: flex; align-items: center; gap: 5px;">
                        📦 先読みバッファ: <span id="prefetch-buffer-stats" style="color: #00e676;">0 / 8 件 (0%)</span>
                    </span>
                    <span id="prefetch-worker-badge" style="font-size: 0.72rem; padding: 2px 7px; border-radius: 4px; background: rgba(255,255,255,0.06); color: #94a3b8; border: 1px solid rgba(255,255,255,0.1);">待機中</span>
                </div>
                <span id="prefetch-buffer-state-text" style="font-size: 0.75rem; color: #94a3b8;">常時先行プール稼働中</span>
            </div>
            <div style="width: 100%; height: 7px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; position: relative;">
                <div id="prefetch-buffer-progress-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #00d2d3, #00e676); transition: width 0.4s ease; box-shadow: 0 0 10px rgba(0, 230, 118, 0.5);"></div>
            </div>
            <div id="prefetch-current-title" style="font-size: 0.73rem; color: #81ecec; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px;">
                <span style="opacity: 0.7;">🎯 先行生成状況:</span> <span id="prefetch-current-title-text" style="color: #cbd5e1;">待機中</span>
            </div>
        </div>

    </div>

    <div id="news-list-container">
        <div class="empty-state">
            <div class="empty-icon">⏳</div>
            <div class="empty-title">ニュースを読み込んでいます...</div>
        </div>
    </div>

    <!-- ニュース取得＆メディア正規化＆事前生成モジュール -->
    <script src="/js/news/news-media-resolver.js?v=21.9"></script>
    <script src="/js/news/news-fetcher.js?v=22.3"></script>
    <script src="/js/news/news-batch-generator.js?v=21.9"></script>

    <script>
        const CATEGORY_NAMES = {
            cat_top: "主要",
            cat_society: "社会",
            cat_world: "国際",
            cat_business: "経済",
            cat_politics: "政治",
            cat_entertainment: "エンタメ",
            cat_sports: "スポーツ",
            cat_tech: "IT・技術",
            cat_science: "科学",
            cat_local: "地域"
        };

        const CATEGORY_ORDER = ["cat_top", "cat_society", "cat_world", "cat_business", "cat_politics", "cat_entertainment", "cat_sports", "cat_tech", "cat_science", "cat_local"];

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function logDiag(msg, level = "info") {
            const fullMsg = `[記事一覧POPUP] ${msg}`;
            if (level === "warn") console.warn(fullMsg);
            else console.log(fullMsg);
            try {
                fetch("/log", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ level: level, message: fullMsg })
                }).catch(() => {});
            } catch (e) {}
        }

        function getFetchedNews() {
            try {
                // 1. 親画面の番組進行リスト(newsBroadcastState.newsList)があれば最優先
                if (window.opener && !window.opener.closed) {
                    if (window.opener.newsBroadcastState && window.opener.newsBroadcastState.newsList && window.opener.newsBroadcastState.newsList.length > 0) {
                        window.latestFetchedNews = window.opener.newsBroadcastState.newsList;
                        return window.latestFetchedNews;
                    }
                }

                // 2. 親画面の latestFetchedNews
                if (window.opener && !window.opener.closed) {
                    if (window.opener.latestFetchedNews && window.opener.latestFetchedNews.length > 0) {
                        window.latestFetchedNews = window.opener.latestFetchedNews;
                        return window.latestFetchedNews;
                    }
                }

                // 3. 自分自身のメモリ（手動更新・抽出直後の最新データ）
                if (window.latestFetchedNews && window.latestFetchedNews.length > 0) {
                    return window.latestFetchedNews;
                }

                // 4. 親画面がない単独起動時のみ localStorage を参照
                const saved = localStorage.getItem("latestFetchedNews");
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed && parsed.length > 0) {
                            window.latestFetchedNews = parsed;
                            return parsed;
                        }
                    } catch (e) { }
                }
                logDiag("ニュースデータが存在しません (0件)", "warn");
            } catch (e) {
                logDiag(`ニュースデータ取得エラー: ${e.message}`, "warn");
            }
            return [];
        }

        window.handleClearReadTitles = function() {
            try {
                localStorage.removeItem("newsReadTitles");
                localStorage.removeItem("vstudio_read_news_titles");
                localStorage.removeItem("currentPlayingNewsTitle");
                localStorage.removeItem("vstudio_news_broadcast_state");
                localStorage.removeItem("vstudio_current_playing_title");
                localStorage.setItem("newsReadExplicitlyCleared", "true");

                if (window.opener && !window.opener.closed) {
                    if (window.opener.readNewsTitles) {
                        window.opener.readNewsTitles.clear();
                    }
                    if (window.opener.newsBroadcastState) {
                        window.opener.newsBroadcastState.readArticles = [];
                        window.opener.newsBroadcastState.currentIndex = 0;
                    }
                    if (typeof window.opener.clearNewsReadFlags === "function") {
                        window.opener.clearNewsReadFlags(true);
                    }
                }
                logDiag("🗑️ 既読フラグをすべてクリアしました（全件未読に戻しました）");
                renderNewsList();
            } catch (e) {
                logDiag(`既読クリアエラー: ${e.message}`, "error");
            }
        };

        function getReadTitles() {
            try {
                if (localStorage.getItem("newsReadExplicitlyCleared") === "true") {
                    return new Set();
                }
                const set = new Set(JSON.parse(localStorage.getItem("newsReadTitles") || "[]"));
                return set;
            } catch (e) {
                return new Set();
            }
        }

        function getSortedNews() {
            const newsList = getFetchedNews();
            if (!newsList || newsList.length === 0) return [];
            return [...newsList].sort((a, b) => {
                const ai = CATEGORY_ORDER.indexOf(a.categoryKey || "cat_top");
                const bi = CATEGORY_ORDER.indexOf(b.categoryKey || "cat_top");
                const catDiff = (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
                if (catDiff !== 0) return catDiff;
                const dateA = new Date(a.pubDate || 0).getTime();
                const dateB = new Date(b.pubDate || 0).getTime();
                return dateA - dateB;
            });
        }

        let _serverCachedTitles = new Set();
        let _isFetchingServerCache = false;

        async function fetchServerNewsCache() {
            if (_isFetchingServerCache) return;
            _isFetchingServerCache = true;
            try {
                const apiPort = (window.location && window.location.port === "8444") ? "8002" : "8001";
                const res = await fetch(`http://localhost:${apiPort}/api/news_cache`);
                if (res.ok) {
                    const data = await res.json();
                    if (data && Array.isArray(data.items)) {
                        _serverCachedTitles = new Set(data.items.map(it => it.title).filter(Boolean));
                    }
                }
            } catch (e) {
            } finally {
                _isFetchingServerCache = false;
            }
        }
        // 初回フェッチを即時キック
        fetchServerNewsCache();

        function getPrefetchStatus(sortedNews, readTitles) {
            let count = 0;
            let max = 8;
            let isRunning = false;
            let currentGenTitle = "";
            let preloadedTitles = [];

            // 1. 【最優先】親画面の UI パネル DOM（#ui-batch-gen-stats）からリアルタイム件数を直結取得
            try {
                if (window.opener && !window.opener.closed && window.opener.document) {
                    const openerStats = window.opener.document.getElementById("ui-batch-gen-stats");
                    if (openerStats && openerStats.textContent) {
                        const txt = openerStats.textContent.trim();
                        const m = txt.match(/(\d+)\s*[\/／]\s*(\d+)/);
                        if (m) {
                            count = parseInt(m[1], 10);
                            max = parseInt(m[2], 10);
                            isRunning = txt.includes("先読み中");
                        }
                    }
                    if (window.opener._currentGeneratingNewsTitle) {
                        currentGenTitle = window.opener._currentGeneratingNewsTitle;
                    }
                }
            } catch (e) {}

            const items = sortedNews || getSortedNews() || [];
            const readSet = readTitles || getReadTitles() || new Set();
            const currentPlayingTitle = localStorage.getItem("currentPlayingNewsTitle") || "";

            // 2. 未読記事リストを作成（現在再生中記事を除く）
            const unreadItems = items.filter(it => !readSet.has(it.title) && (!currentPlayingTitle || !it.title.includes(currentPlayingTitle)));

            // 3. 親画面のDOMから count が取得できた場合、未読記事の先頭から count 件を先読み済みリストとする
            if (count > 0) {
                for (let i = 0; i < Math.min(count, unreadItems.length); i++) {
                    preloadedTitles.push(unreadItems[i].title);
                }
                if (isRunning && !currentGenTitle && unreadItems.length > count) {
                    currentGenTitle = unreadItems[count].title;
                }
            } else {
                // 4. フォールバック: サーバーキャッシュ（前方16文字あいまい一致）から照合
                const cachedSet = _serverCachedTitles;
                for (let i = 0; i < unreadItems.length; i++) {
                    const it = unreadItems[i];
                    const cleanT = it.title.substring(0, 16);
                    let hit = cachedSet.has(it.title);
                    if (!hit) {
                        for (const ct of cachedSet) {
                            if (ct.includes(cleanT) || it.title.includes(ct.substring(0, 16))) {
                                hit = true;
                                break;
                            }
                        }
                    }
                    if (hit) {
                        if (preloadedTitles.length < max) {
                            preloadedTitles.push(it.title);
                        }
                    } else if (!currentGenTitle && preloadedTitles.length < max) {
                        currentGenTitle = it.title;
                    }
                }
                count = Math.min(max, preloadedTitles.length);
                isRunning = count < max && currentGenTitle !== "";
            }

            const pct = Math.min(100, Math.round((count / max) * 100));

            return {
                count: count,
                max: max,
                pct: pct,
                isRunning: isRunning,
                currentTitle: currentGenTitle,
                titles: preloadedTitles
            };
        }

        function updatePrefetchDisplay() {
            fetchServerNewsCache();
            const status = getPrefetchStatus();
            const statsEl = document.getElementById("prefetch-buffer-stats");
            const barEl = document.getElementById("prefetch-buffer-progress-bar");
            const badgeEl = document.getElementById("prefetch-worker-badge");
            const stateTextEl = document.getElementById("prefetch-buffer-state-text");
            const currentTitleEl = document.getElementById("prefetch-current-title-text");

            if (!statsEl || !barEl) return;

            const count = status.count || 0;
            const max = status.max || 8;
            const pct = Math.min(100, Math.round((count / max) * 100));

            statsEl.textContent = `${count} / ${max} 件 (${pct}%)`;
            barEl.style.width = `${pct}%`;

            if (status.isRunning) {
                badgeEl.textContent = "⏳ 先行生成中";
                badgeEl.style.background = "rgba(0, 210, 211, 0.2)";
                badgeEl.style.color = "#00f3ff";
                badgeEl.style.borderColor = "rgba(0, 210, 211, 0.5)";
                stateTextEl.textContent = "先行生成ワーカー稼働中";
                stateTextEl.style.color = "#00f3ff";
            } else if (count >= max) {
                badgeEl.textContent = "✅ プール満杯";
                badgeEl.style.background = "rgba(0, 230, 118, 0.2)";
                badgeEl.style.color = "#00e676";
                badgeEl.style.borderColor = "rgba(0, 230, 118, 0.5)";
                stateTextEl.textContent = "即時再生バッファ準備完了";
                stateTextEl.style.color = "#00e676";
            } else if (count > 0) {
                badgeEl.textContent = "📦 蓄積中";
                badgeEl.style.background = "rgba(129, 236, 236, 0.15)";
                badgeEl.style.color = "#81ecec";
                badgeEl.style.borderColor = "rgba(129, 236, 236, 0.4)";
                stateTextEl.textContent = "先行プール待機中";
                stateTextEl.style.color = "#81ecec";
            } else {
                badgeEl.textContent = "⚪ 待機中";
                badgeEl.style.background = "rgba(255, 255, 255, 0.06)";
                badgeEl.style.color = "#94a3b8";
                badgeEl.style.borderColor = "rgba(255, 255, 255, 0.1)";
                stateTextEl.textContent = "先読み待機中";
                stateTextEl.style.color = "#94a3b8";
            }

            if (currentTitleEl) {
                if (status.currentTitle) {
                    currentTitleEl.textContent = `「${status.currentTitle}」`;
                    currentTitleEl.style.color = "#00f3ff";
                } else if (status.isRunning) {
                    currentTitleEl.textContent = "次の記事を直列処理中...";
                    currentTitleEl.style.color = "#81ecec";
                } else if (count >= max) {
                    currentTitleEl.textContent = "最大先読み件数(8件)に到達したため待機中";
                    currentTitleEl.style.color = "#94a3b8";
                } else {
                    currentTitleEl.textContent = "待機中";
                    currentTitleEl.style.color = "#64748b";
                }
            }
        }

        function renderNewsList() {
            const container = document.getElementById("news-list-container");
            const badge = document.getElementById("news-count-badge");
            const sortedNews = getSortedNews();
            const readTitles = getReadTitles();
            const prefetchStatus = getPrefetchStatus(sortedNews, readTitles);
            const preloadedTitlesSet = new Set(prefetchStatus.titles || []);
            const allCachedTitlesSet = new Set(prefetchStatus.allCachedTitles || []);
            const currentGenTitle = prefetchStatus.currentTitle || "";

            if (!sortedNews || sortedNews.length === 0) {
                badge.textContent = "0 件";
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📰</div>
                        <div class="empty-title">まだニュースが取得されていません</div>
                        <div class="empty-desc">メイン画面の「⬇️ ニュースを取得」ボタンを押してニュースを取得してください。</div>
                    </div>
                `;
                return;
            }

            const checkRead = (title) => {
                if (!title) return false;
                if (localStorage.getItem("newsReadExplicitlyCleared") === "true") return false;
                if (readTitles.has(title)) return true;
                if (window.opener && typeof window.opener.isNewsTitleRead === "function") {
                    return window.opener.isNewsTitleRead(title);
                }
                return false;
            };

            const unreadCount = sortedNews.filter(n => !checkRead(n.title)).length;
            const readCount = sortedNews.length - unreadCount;
            badge.innerHTML = `全 ${sortedNews.length} 件 (未読: ${unreadCount} / 既読: ${readCount}) <span style="margin-left:8px; color:#00f3ff; font-weight:700;">📦 先読み: ${prefetchStatus.count}/${prefetchStatus.max}件</span>`;

            // 現在放送中のタイトル
            const currentPlayingTitle = localStorage.getItem("currentPlayingNewsTitle") || "";

            let html = "";
            let isFirstUnreadMarked = false;

            sortedNews.forEach((item, idx) => {
                const isRead = checkRead(item.title);
                const isPlaying = currentPlayingTitle && item.title.includes(currentPlayingTitle);
                const isPreloaded = (preloadedTitlesSet.has(item.title) || allCachedTitlesSet.has(item.title)) && !isRead;
                const isGenerating = currentGenTitle && item.title.includes(currentGenTitle);
                const catKey = item.categoryKey || "cat_top";
                const catName = CATEGORY_NAMES[catKey] || item.category || "ニュース";
                const linkUrl = item.link || item.url || "";

                let idAttr = "";
                let firstUnreadClass = "";
                if (isPlaying) {
                    idAttr = 'id="current-playing-news-card"';
                } else if (!isRead && !isFirstUnreadMarked) {
                    firstUnreadClass = "is-unread-first";
                    isFirstUnreadMarked = true;
                }

                html += `
                    <div class="news-card ${isPlaying ? 'is-playing' : ''} ${isPreloaded ? 'is-preloaded' : ''} ${isRead ? 'is-read' : ''} ${firstUnreadClass}" ${idAttr}>
                        <div class="news-card-header">
                            <div class="card-tags">
                                <span class="cat-badge cat-${catKey}">${escapeHtml(catName)}</span>
                                ${isPlaying ? '<span class="playing-badge">🎙️ 放送中</span>' : ''}
                                ${isGenerating ? '<span class="generating-badge">⏳ 先読み生成中</span>' : ''}
                                ${isPreloaded && !isPlaying ? '<span class="preloaded-badge">⚡ 先読み済</span>' : ''}
                                <span style="font-size:0.75rem; color:#64748b; font-family:\'Fira Code\',monospace;">#${idx + 1}</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <button class="start-here-btn" onclick="startNewsFromCard(${idx}, event)" title="このニュースから読み上げを開始します">▶ ここから始める</button>
                                <span class="read-status">${isRead ? '✅ 既読' : '🆕 未読'}</span>
                            </div>
                        </div>
                        <div class="news-title">${escapeHtml(item.title)}</div>
                        ${item.description ? `<div class="news-desc">${escapeHtml(item.description)}</div>` : ''}
                        <div class="news-card-footer">
                            <span>📅 ${escapeHtml(item.pubDate || item.pub_date || '2026-09-26 12:00')}</span>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <button class="card-cache-btn" onclick="handleOpenCacheViewerFromCard(${idx}, event);" title="ニュース原稿キャッシュマネージャーを開く">🗄️ キャッシュ</button>
                                ${linkUrl ? `<a href="${escapeHtml(linkUrl)}" target="_blank" rel="noopener noreferrer" class="news-link">🔗 元記事を開く ↗</a>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        window.startNewsFromCard = function(index, event) {
            if (event) event.stopPropagation();
            try { localStorage.removeItem("newsReadExplicitlyCleared"); } catch (e) {}
            const sortedNews = getSortedNews();
            if (!sortedNews || !sortedNews[index]) return;
            const targetItem = sortedNews[index];
            const targetTitle = targetItem.title;

            // 1. 親ウィンドウのAPIを直接実行
            let sent = false;
            try {
                const hostWin = (window.opener && !window.opener.closed) ? window.opener : (window.parent !== window ? window.parent : window);
                if (hostWin) {
                    if (typeof hostWin.startNewsFromTitle === "function") {
                        hostWin.startNewsFromTitle(targetTitle);
                        sent = true;
                    }
                    if (typeof hostWin.startYoutubeConnection === "function") {
                        const savedVid = localStorage.getItem("savedYoutubeVideoId") || "Nm0gt_3hxyM";
                        hostWin.startYoutubeConnection(savedVid);
                    }
                }
            } catch (e) {}

            // 2. 直接実行できなかった場合のみ localStorageイベントでフォールバック
            if (!sent) {
                localStorage.setItem("startNewsRequest", JSON.stringify({
                    title: targetTitle,
                    timestamp: Date.now()
                }));
            }

            // UIフィードバック
            const btn = event ? event.currentTarget : null;
            if (btn) {
                btn.innerHTML = "✨ 開始しました！";
                btn.style.background = "#00e676";
                btn.style.color = "#051a10";
                btn.style.borderColor = "#00e676";
                setTimeout(() => {
                    renderNewsList();
                }, 1000);
            }
        };

        window.scrollToPlayingNews = function(smooth = true) {
            const target = document.getElementById("current-playing-news-card") || document.querySelector(".is-unread-first");
            if (target) {
                target.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "center" });
                target.classList.remove("pulse-active");
                void target.offsetWidth;
                target.classList.add("pulse-active");
            } else {
                window.scrollTo({ top: 0, behavior: smooth ? "smooth" : "auto" });
            }
        };

        async function handleRestoreClick(btn) {
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = "⏳ 復元中...";
            }

            try {
                let restoredList = null;
                let restoredTotal = 0;

                // 1. 【最優先】親画面で現在進行中の番組リストから100%復元
                if (window.opener && !window.opener.closed) {
                    if (window.opener.newsBroadcastState && Array.isArray(window.opener.newsBroadcastState.newsList) && window.opener.newsBroadcastState.newsList.length > 0) {
                        restoredList = window.opener.newsBroadcastState.newsList;
                        restoredTotal = restoredList.length;

                        // 親画面の totalCount も実際のリスト件数（99件等）に完全整合
                        window.opener.newsBroadcastState.totalCount = restoredTotal;
                        window.opener.latestFetchedNews = restoredList;

                        // 親画面のUI（進行インジケーター・セットリストバッジ）も正確に同期
                        const currentIdx = window.opener.newsBroadcastState.currentIndex || 0;
                        if (typeof window.opener.updateNewsSetlistProgress === "function") {
                            window.opener.updateNewsSetlistProgress(
                                window.opener.newsBroadcastState.currentCategoryKey || "cat_top",
                                currentIdx,
                                restoredTotal
                            );
                        }
                    } else if (Array.isArray(window.opener.latestFetchedNews) && window.opener.latestFetchedNews.length > 0) {
                        restoredList = window.opener.latestFetchedNews;
                        restoredTotal = restoredList.length;
                    }
                }

                // 2. 親画面から取得できない場合は localStorage の最新配信リストから復元
                if (!restoredList || restoredList.length === 0) {
                    const saved = localStorage.getItem("latestFetchedNews");
                    if (saved) {
                        try {
                            const parsed = JSON.parse(saved);
                            if (Array.isArray(parsed) && parsed.length > 0) {
                                restoredList = parsed;
                                restoredTotal = parsed.length;
                            }
                        } catch (e) {}
                    }
                }

                if (restoredList && restoredList.length > 0) {
                    window.latestFetchedNews = restoredList;
                    try { localStorage.setItem("latestFetchedNews", JSON.stringify(restoredList)); } catch (e) {}
                    logDiag(`✅ 今回の配信番組リスト (全 ${restoredTotal} 件) を完全に再同期・復元しました！`);
                } else {
                    logDiag("⚠️ 復元可能な配信リストが見つかりませんでした (0件)", "warn");
                }
            } catch (err) {
                logDiag(`復元エラー: ${err.message}`, "error");
            }

            renderNewsList();
            updatePrefetchDisplay();

            if (btn) {
                btn.innerHTML = "✅ 復元完了";
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = "🔄 リスト復元";
                }, 1200);
            }
        }

        // 初期化 & 定期更新（親画面や別ウィンドウの変更を自動同期）
        renderNewsList();
        updatePrefetchDisplay();
        setInterval(renderNewsList, 2500);
        setInterval(updatePrefetchDisplay, 1000);

        // 原稿一括事前生成 UI 制御（ルール18準拠: alert完全排除）
        function updateBatchGenUI(status) {
            const label = document.getElementById("batch-gen-label");
            const stats = document.getElementById("batch-gen-stats");
            const bar = document.getElementById("batch-gen-progress-bar");
            const curTitle = document.getElementById("batch-gen-current-title");
            const startBtn = document.getElementById("batch-gen-start-btn");
            const stopBtn = document.getElementById("batch-gen-stop-btn");

            if (!label || !stats || !bar || !startBtn || !stopBtn) return;

            stats.textContent = `${status.completed} / ${status.total} 件 (${status.percent}%)`;
            bar.style.width = `${status.percent}%`;
            curTitle.textContent = status.currentTitle ? `生成中: ${status.currentTitle}` : "";

            if (status.state === "running") {
                label.textContent = "📝 原稿事前生成: 実行中...";
                label.style.color = "#00e676";
                startBtn.textContent = "⏸️ 一時停止";
                startBtn.style.display = "inline-flex";
                stopBtn.style.display = "inline-flex";
            } else if (status.state === "paused") {
                label.textContent = "📝 原稿事前生成: 一時停止中";
                label.style.color = "#ffeaa7";
                startBtn.textContent = "▶️ 再開";
                startBtn.style.display = "inline-flex";
                stopBtn.style.display = "inline-flex";
            } else if (status.state === "completed") {
                label.textContent = "📝 原稿事前生成: 全件完了！";
                label.style.color = "#00d2d3";
                curTitle.textContent = "🎉 すべての記事の原稿事前生成が完了しました！";
                startBtn.textContent = "▶️ 再生成";
                startBtn.style.display = "inline-flex";
                stopBtn.style.display = "none";
            } else {
                label.textContent = "📝 原稿事前生成: 待機中";
                label.style.color = "#81ecec";
                startBtn.textContent = "▶️ 一括生成";
                startBtn.style.display = "inline-flex";
                stopBtn.style.display = "none";
            }
        }

        if (window.NewsBatchGenerator) {
            window.NewsBatchGenerator.addListener((event, status) => {
                updateBatchGenUI(status);
            });
        }

        function handleBatchGenToggle() {
            if (!window.NewsBatchGenerator) return;
            const status = window.NewsBatchGenerator.getStatus();
            if (status.state === "running") {
                window.NewsBatchGenerator.pause();
            } else if (status.state === "paused") {
                window.NewsBatchGenerator.resume();
            } else {
                const items = getSortedNews();
                if (!items || items.length === 0) {
                    const curTitle = document.getElementById("batch-gen-current-title");
                    if (curTitle) curTitle.textContent = "⚠️ ニュース記事がありません。先に更新ボタンを押してください。";
                    return;
                }
                window.NewsBatchGenerator.start(items);
            }
        }

        function handleBatchGenStop() {
            if (!window.NewsBatchGenerator) return;
            window.NewsBatchGenerator.stop();
        }

        // ── ニュースキャッシュマネージャーを開く ──
        window.handleOpenCacheViewerFromCard = function(index, event) {
            if (event) event.stopPropagation();
            const sortedNews = getSortedNews();
            if (!sortedNews || !sortedNews[index]) {
                handleOpenCacheViewer();
                return;
            }
            const targetItem = sortedNews[index];
            const linkUrl = targetItem.link || targetItem.url || "";
            handleOpenCacheViewer(targetItem.title, linkUrl);
        };

        function handleOpenCacheViewer(targetTitle = "", targetUrl = "") {
            if (targetTitle) {
                try {
                    localStorage.setItem("vstudio_cache_scroll_target", JSON.stringify({
                        title: targetTitle,
                        url: targetUrl || "",
                        time: Date.now()
                    }));
                } catch (e) {}
            }

            if (window.opener && typeof window.opener.openNewsCachePopup === "function") {
                window.opener.openNewsCachePopup(targetTitle, targetUrl);
            } else {
                let width = 960;
                let height = 750;
                try {
                    const saved = localStorage.getItem("vstudio_news_cache_window_size");
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed.width && parsed.height) {
                            width = Math.min(window.screen.availWidth || 1920, Math.max(600, parsed.width));
                            height = Math.min(window.screen.availHeight || 1080, Math.max(500, parsed.height));
                        }
                    }
                } catch (e) {}
                const left = Math.max(0, (window.screen.width - width) / 2);
                const top = Math.max(0, (window.screen.height - height) / 2);
                const queryParams = new URLSearchParams({ t: Date.now() });
                if (targetTitle) queryParams.set("target", targetTitle);
                if (targetUrl) queryParams.set("url", targetUrl);

                window.open(
                    `/news_cache_viewer.html?${queryParams.toString()}`,
                    "VStudioNewsCacheWindow",
                    `width=${width},height=${height},left=${left},top=${top},menubar=no,toolbar=no,location=no,status=no,resizable=yes`
                );
            }
        }

        // ── ウィンドウサイズの自動記憶（次回オープン時に復元） ──
        let newsListResizeTimer = null;
        window.addEventListener("resize", () => {
            clearTimeout(newsListResizeTimer);
            newsListResizeTimer = setTimeout(() => {
                try {
                    const size = {
                        width: window.outerWidth || window.innerWidth,
                        height: window.outerHeight || window.innerHeight
                    };
                    localStorage.setItem("vstudio_news_list_window_size", JSON.stringify(size));
                } catch (e) {}
            }, 300);
        });
    </script>
</body>
