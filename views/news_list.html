<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📰 取得済みのニュース一覧</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0f121d;
            --bg-card: #181d2c;
            --bg-card-hover: #22293d;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(0, 210, 211, 0.4);
            --text-main: #f1f2f6;
            --text-muted: #8b949e;
            --accent-green: #00e676;
            --accent-blue: #00d2d3;
            --accent-orange: #ff9f43;
            --accent-pink: #ff6b81;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px 20px;
            overflow-y: auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: rgba(15, 18, 29, 0.96);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stats-badge {
            background: rgba(0, 210, 211, 0.15);
            color: #81ecec;
            border: 1px solid rgba(0, 210, 211, 0.35);
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: #e2e8f0;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.25);
            color: #ffffff;
        }

        .action-btn.jump-btn {
            background: linear-gradient(135deg, #00e676, #00b894);
            color: #051a10;
            border: none;
            box-shadow: 0 2px 10px rgba(0, 230, 118, 0.35);
        }

        .action-btn.jump-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(0, 230, 118, 0.6);
        }

        #news-list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 20px;
        }

        .news-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 16px;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .news-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .news-card.is-playing {
            border-color: var(--accent-green);
            background: linear-gradient(135deg, rgba(0, 230, 118, 0.12) 0%, rgba(24, 29, 44, 0.95) 100%);
            box-shadow: 0 0 16px rgba(0, 230, 118, 0.3);
        }

        .news-card.is-read {
            opacity: 0.65;
        }

        .news-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .card-tags {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cat-badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 5px;
            color: #fff;
            background: #485460;
        }

        .cat-cat_top { background: linear-gradient(135deg, #e84118, #c23616); }
        .cat-cat_society { background: linear-gradient(135deg, #0097e6, #00a8ff); }
        .cat-cat_world { background: linear-gradient(135deg, #8c7ae6, #9c88ff); }
        .cat-cat_business { background: linear-gradient(135deg, #44bd32, #4cd137); }
        .cat-cat_politics { background: linear-gradient(135deg, #e1b12c, #fbc531); color: #000; }
        .cat-cat_entertainment { background: linear-gradient(135deg, #e84393, #fd79a8); }
        .cat-cat_sports { background: linear-gradient(135deg, #e67e22, #f39c12); }
        .cat-cat_tech { background: linear-gradient(135deg, #00cec9, #81ecec); color: #000; }
        .cat-cat_science { background: linear-gradient(135deg, #16a085, #1abc9c); }
        .cat-cat_local { background: linear-gradient(135deg, #7f8c8d, #95a5a6); }

        .playing-badge {
            background: #00e676;
            color: #000;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .read-status {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .start-here-btn {
            background: linear-gradient(135deg, rgba(0, 210, 211, 0.15), rgba(0, 168, 255, 0.15));
            border: 1px solid rgba(0, 210, 211, 0.4);
            color: #81ecec;
            border-radius: 6px;
            padding: 3px 9px;
            font-size: 0.73rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
        }

        .start-here-btn:hover {
            background: linear-gradient(135deg, #00d2d3, #00b894);
            color: #051a10;
            border-color: #00d2d3;
            box-shadow: 0 2px 10px rgba(0, 210, 211, 0.45);
            transform: translateY(-1px);
        }

        .start-here-btn:active {
            transform: translateY(0);
        }

        .news-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.45;
            margin-bottom: 6px;
        }

        .news-desc {
            font-size: 0.82rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .news-link {
            color: #00d2d3;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: color 0.15s;
        }

        .news-link:hover {
            color: #81ecec;
            text-decoration: underline;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .empty-title {
            font-size: 1.1rem;
            color: #e2e8f0;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .empty-desc {
            font-size: 0.85rem;
            line-height: 1.6;
        }

        @keyframes focusPulse {
            0% { transform: scale(1); box-shadow: 0 0 16px rgba(0, 230, 118, 0.4); }
            50% { transform: scale(1.02); box-shadow: 0 0 24px rgba(0, 230, 118, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 16px rgba(0, 230, 118, 0.4); }
        }

        .pulse-active {
            animation: focusPulse 0.8s ease;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        ::-webkit-scrollbar-thumb { background: #2a3144; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3c4660; }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <h3>📰 取得済みのニュース一覧</h3>
            <span class="stats-badge" id="news-count-badge">0 件</span>
        </div>
        <div class="header-actions">
            <button class="action-btn" id="open-cache-btn" onclick="handleOpenCacheViewer()" style="background: linear-gradient(135deg, rgba(0, 210, 211, 0.2), rgba(165, 94, 234, 0.25)); border-color: rgba(0, 210, 211, 0.4); color: #00f3ff;" title="ニュース原稿キャッシュマネージャーを開く">
                🗄️ キャッシュ確認
            </button>
            <button class="action-btn jump-btn" id="jump-to-current-btn" onclick="scrollToPlayingNews(true)">
                🎯 放送中へジャンプ
            </button>
            <button class="action-btn" id="refresh-btn" onclick="handleRefreshClick(this)">
                🔄 更新
            </button>
        </div>
    </header>

    <!-- 原稿一括事前生成バー -->
    <div id="batch-gen-panel" style="background: rgba(16, 24, 40, 0.7); border: 1px solid rgba(0, 210, 211, 0.25); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <div style="flex: 1; min-width: 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                <span id="batch-gen-label" style="font-size: 0.8rem; font-weight: 600; color: #81ecec;">📝 原稿事前生成: 待機中</span>
                <span id="batch-gen-stats" style="font-size: 0.75rem; color: #94a3b8;">0 / 0 件 (0%)</span>
            </div>
            <div style="width: 100%; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden;">
                <div id="batch-gen-progress-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #00d2d3, #00e676); transition: width 0.3s ease;"></div>
            </div>
            <div id="batch-gen-current-title" style="font-size: 0.72rem; color: #64748b; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></div>
        </div>
        <div style="display: flex; gap: 6px; flex-shrink: 0;">
            <button id="batch-gen-start-btn" class="action-btn" style="background: linear-gradient(135deg, rgba(0, 210, 211, 0.2), rgba(0, 230, 118, 0.2)); border-color: #00d2d3; color: #81ecec;" onclick="handleBatchGenToggle()">
                ▶️ 一括生成
            </button>
            <button id="batch-gen-stop-btn" class="action-btn" style="display: none; background: rgba(255, 71, 87, 0.15); border-color: #ff4757; color: #ff6b81;" onclick="handleBatchGenStop()">
                ⏹️ 中止
            </button>
        </div>
    </div>

    <div id="news-list-container">
        <div class="empty-state">
            <div class="empty-icon">⏳</div>
            <div class="empty-title">ニュースを読み込んでいます...</div>
        </div>
    </div>

    <!-- ニュース取得＆メディア正規化＆事前生成モジュール -->
    <script src="/js/news/news-media-resolver.js?v=21.9"></script>
    <script src="/js/news/news-fetcher.js?v=22.2"></script>
    <script src="/js/news/news-batch-generator.js?v=21.9"></script>

    <script>
        const CATEGORY_NAMES = {
            cat_top: "主要",
            cat_society: "社会",
            cat_world: "国際",
            cat_business: "経済",
            cat_politics: "政治",
            cat_entertainment: "エンタメ",
            cat_sports: "スポーツ",
            cat_tech: "IT・技術",
            cat_science: "科学",
            cat_local: "地域"
        };

        const CATEGORY_ORDER = ["cat_top", "cat_society", "cat_world", "cat_business", "cat_politics", "cat_entertainment", "cat_sports", "cat_tech", "cat_science", "cat_local"];

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function logDiag(msg, level = "info") {
            const fullMsg = `[記事一覧POPUP] ${msg}`;
            if (level === "warn") console.warn(fullMsg);
            else console.log(fullMsg);
            try {
                fetch("/log", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ level: level, message: fullMsg })
                }).catch(() => {});
            } catch (e) {}
        }

        function getFetchedNews() {
            try {
                // 1. 自分自身のメモリ
                let selfNews = (window.latestFetchedNews && window.latestFetchedNews.length > 0) ? window.latestFetchedNews : [];

                // 2. 親画面のメモリ
                let openerNews = [];
                if (window.opener && !window.opener.closed) {
                    if (window.opener.newsBroadcastState && window.opener.newsBroadcastState.newsList && window.opener.newsBroadcastState.newsList.length > 0) {
                        openerNews = window.opener.newsBroadcastState.newsList;
                    } else if (window.opener.latestFetchedNews && window.opener.latestFetchedNews.length > 0) {
                        openerNews = window.opener.latestFetchedNews;
                    }
                }

                // 3. localStorage
                let localNews = [];
                const saved = localStorage.getItem("latestFetchedNews");
                if (saved) {
                    try { localNews = JSON.parse(saved); } catch (e) { }
                }

                // 全候補の中で最も件数の多い（最新・完全な）リストを無条件で最優先採用
                let candidates = [
                    { list: selfNews, desc: `自身のメモリ (${selfNews.length}件)` },
                    { list: openerNews, desc: `親画面 (${openerNews.length}件)` },
                    { list: localNews, desc: `localStorage (${localNews.length}件)` }
                ];
                candidates.sort((a, b) => b.list.length - a.list.length);

                let best = candidates[0];
                if (best.list.length > 0) {
                    // 親画面と自身のメモリを最新リストで完全同期
                    window.latestFetchedNews = best.list;
                    if (window.opener && !window.opener.closed) {
                        window.opener.latestFetchedNews = best.list;
                    }
                    if (window._lastLoggedCandidateDesc !== best.desc) {
                        window._lastLoggedCandidateDesc = best.desc;
                        console.log(`[記事一覧POPUP] ${best.desc} を採用しました`);
                    }
                    return best.list;
                }
                logDiag("ニュースデータが存在しません (0件)", "warn");
            } catch (e) {
                logDiag(`ニュースデータ取得エラー: ${e.message}`, "warn");
            }
            return [];
        }

        function getReadTitles() {
            try {
                return new Set(JSON.parse(localStorage.getItem("newsReadTitles") || "[]"));
            } catch (e) {
                return new Set();
            }
        }

        function getSortedNews() {
            const newsList = getFetchedNews();
            if (!newsList || newsList.length === 0) return [];
            return [...newsList].sort((a, b) => {
                const ai = CATEGORY_ORDER.indexOf(a.categoryKey || "cat_top");
                const bi = CATEGORY_ORDER.indexOf(b.categoryKey || "cat_top");
                const catDiff = (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
                if (catDiff !== 0) return catDiff;
                const dateA = new Date(a.pubDate || 0).getTime();
                const dateB = new Date(b.pubDate || 0).getTime();
                return dateA - dateB;
            });
        }

        function renderNewsList() {
            const container = document.getElementById("news-list-container");
            const badge = document.getElementById("news-count-badge");
            const sortedNews = getSortedNews();
            const readTitles = getReadTitles();

            if (!sortedNews || sortedNews.length === 0) {
                badge.textContent = "0 件";
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📰</div>
                        <div class="empty-title">まだニュースが取得されていません</div>
                        <div class="empty-desc">メイン画面の「⬇️ ニュースを取得」ボタンを押してニュースを取得してください。</div>
                    </div>
                `;
                return;
            }

            const unreadCount = sortedNews.filter(n => !readTitles.has(n.title)).length;
            const readCount = sortedNews.length - unreadCount;
            badge.textContent = `全 ${sortedNews.length} 件 (未読: ${unreadCount} / 既読: ${readCount})`;

            // 現在放送中のタイトル
            const currentPlayingTitle = localStorage.getItem("currentPlayingNewsTitle") || "";

            let html = "";
            let isFirstUnreadMarked = false;

            sortedNews.forEach((item, idx) => {
                const isRead = readTitles.has(item.title);
                const isPlaying = currentPlayingTitle && item.title.includes(currentPlayingTitle);
                const catKey = item.categoryKey || "cat_top";
                const catName = CATEGORY_NAMES[catKey] || item.category || "ニュース";
                const linkUrl = item.link || item.url || "";

                let idAttr = "";
                let firstUnreadClass = "";
                if (isPlaying) {
                    idAttr = 'id="current-playing-news-card"';
                } else if (!isRead && !isFirstUnreadMarked) {
                    firstUnreadClass = "is-unread-first";
                    isFirstUnreadMarked = true;
                }

                html += `
                    <div class="news-card ${isPlaying ? 'is-playing' : ''} ${isRead ? 'is-read' : ''} ${firstUnreadClass}" ${idAttr}>
                        <div class="news-card-header">
                            <div class="card-tags">
                                <span class="cat-badge cat-${catKey}">${escapeHtml(catName)}</span>
                                ${isPlaying ? '<span class="playing-badge">🎙️ 放送中</span>' : ''}
                                <span style="font-size:0.75rem; color:#64748b; font-family:\'Fira Code\',monospace;">#${idx + 1}</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <button class="start-here-btn" onclick="startNewsFromCard(${idx}, event)" title="このニュースから読み上げを開始します">▶ ここから始める</button>
                                <span class="read-status">${isRead ? '✅ 既読' : '🆕 未読'}</span>
                            </div>
                        </div>
                        <div class="news-title">${escapeHtml(item.title)}</div>
                        ${item.description ? `<div class="news-desc">${escapeHtml(item.description)}</div>` : ''}
                        <div class="news-card-footer">
                            <span>📅 ${escapeHtml(item.pubDate || '日時不明')}</span>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <button class="action-btn" style="padding: 2px 8px; font-size: 0.72rem; background: rgba(0, 210, 211, 0.12); border-color: rgba(0, 210, 211, 0.35); color: #00f3ff; border-radius: 4px;" onclick="handleOpenCacheViewer(); event.stopPropagation();" title="ニュース原稿キャッシュマネージャーを開く">🗄️ キャッシュ</button>
                                ${linkUrl ? `<a href="${escapeHtml(linkUrl)}" target="_blank" rel="noopener noreferrer" class="news-link">🔗 元記事を開く ↗</a>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        window.startNewsFromCard = function(index, event) {
            if (event) event.stopPropagation();
            const sortedNews = getSortedNews();
            if (!sortedNews || !sortedNews[index]) return;
            const targetItem = sortedNews[index];
            const targetTitle = targetItem.title;

            // 1. 親ウィンドウのAPIを直接実行
            let sent = false;
            try {
                const hostWin = (window.opener && !window.opener.closed) ? window.opener : (window.parent !== window ? window.parent : window);
                if (hostWin && typeof hostWin.startNewsFromTitle === "function") {
                    hostWin.startNewsFromTitle(targetTitle);
                    sent = true;
                }
            } catch (e) {}

            // 2. 直接実行できなかった場合のみ localStorageイベントでフォールバック
            if (!sent) {
                localStorage.setItem("startNewsRequest", JSON.stringify({
                    title: targetTitle,
                    timestamp: Date.now()
                }));
            }

            // UIフィードバック
            const btn = event ? event.currentTarget : null;
            if (btn) {
                btn.innerHTML = "✨ 開始しました！";
                btn.style.background = "#00e676";
                btn.style.color = "#051a10";
                btn.style.borderColor = "#00e676";
                setTimeout(() => {
                    renderNewsList();
                }, 1000);
            }
        };

        window.scrollToPlayingNews = function(smooth = true) {
            const target = document.getElementById("current-playing-news-card") || document.querySelector(".is-unread-first");
            if (target) {
                target.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "center" });
                target.classList.remove("pulse-active");
                void target.offsetWidth;
                target.classList.add("pulse-active");
            } else {
                window.scrollTo({ top: 0, behavior: smooth ? "smooth" : "auto" });
            }
        };

        function getNewsFilterParams() {
            let cat = "cat_all";
            let maxCount = 999;
            let startDate = null;
            let endDate = null;

            if (window.opener && !window.opener.closed && window.opener.document) {
                const doc = window.opener.document;
                const catEl = doc.getElementById("news-rss-select");
                const countEl = doc.getElementById("news-item-count-select");
                const startEl = doc.getElementById("news-date-start");
                const endEl = doc.getElementById("news-date-end");

                if (catEl && catEl.value) cat = catEl.value;
                if (countEl && countEl.value) {
                    const c = parseInt(countEl.value, 10);
                    if (!isNaN(c) && c > 0) maxCount = c;
                }
                if (startEl && startEl.value) startDate = startEl.value;
                if (endEl && endEl.value) endDate = endEl.value;
            }

            // 親画面から取得できない場合は当日の標準配信時間帯（夜配信: 05:00〜17:59）で抽出
            if (!startDate || !endDate) {
                const now = new Date();
                const y = now.getFullYear();
                const m = String(now.getMonth() + 1).padStart(2, "0");
                const d = String(now.getDate()).padStart(2, "0");
                const todayStr = `${y}-${m}-${d}`;
                startDate = `${todayStr}T05:00`;
                endDate = `${todayStr}T17:59`;
            }

            return { cat, maxCount, startDate, endDate };
        }

        async function handleRefreshClick(btn) {
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = "⏳ 抽出中...";
            }
            const params = getNewsFilterParams();
            logDiag(`🔄 手動更新が要求されました。配信条件 (${params.startDate} 〜 ${params.endDate}) で最新ニュースを抽出します...`);
            try {
                if (typeof window.fetchNewsWithOptions === "function") {
                    const freshItems = await window.fetchNewsWithOptions(params.cat, params.maxCount, params.startDate, params.endDate);
                    logDiag(`✅ 配信対象ニュースの抽出が完了しました: 全 ${freshItems.length} 件`);
                } else if (typeof fetchNewsWithOptions === "function") {
                    const freshItems = await fetchNewsWithOptions(params.cat, params.maxCount, params.startDate, params.endDate);
                    logDiag(`✅ 配信対象ニュースの抽出が完了しました: 全 ${freshItems.length} 件`);
                }
            } catch (err) {
                logDiag(`ニュース抽出エラー: ${err.message}`, "warn");
            }
            renderNewsList();
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = "🔄 更新";
            }
        }

        // 初期化 & 定期更新（親画面や別ウィンドウの変更を自動同期）
        renderNewsList();
        setInterval(renderNewsList, 2500);

        // 原稿一括事前生成 UI 制御（ルール18準拠: alert完全排除）
        function updateBatchGenUI(status) {
            const label = document.getElementById("batch-gen-label");
            const stats = document.getElementById("batch-gen-stats");
            const bar = document.getElementById("batch-gen-progress-bar");
            const curTitle = document.getElementById("batch-gen-current-title");
            const startBtn = document.getElementById("batch-gen-start-btn");
            const stopBtn = document.getElementById("batch-gen-stop-btn");

            if (!label || !stats || !bar || !startBtn || !stopBtn) return;

            stats.textContent = `${status.completed} / ${status.total} 件 (${status.percent}%)`;
            bar.style.width = `${status.percent}%`;
            curTitle.textContent = status.currentTitle ? `生成中: ${status.currentTitle}` : "";

            if (status.state === "running") {
                label.textContent = "📝 原稿事前生成: 実行中...";
                label.style.color = "#00e676";
                startBtn.textContent = "⏸️ 一時停止";
                startBtn.style.display = "inline-flex";
                stopBtn.style.display = "inline-flex";
            } else if (status.state === "paused") {
                label.textContent = "📝 原稿事前生成: 一時停止中";
                label.style.color = "#ffeaa7";
                startBtn.textContent = "▶️ 再開";
                startBtn.style.display = "inline-flex";
                stopBtn.style.display = "inline-flex";
            } else if (status.state === "completed") {
                label.textContent = "📝 原稿事前生成: 全件完了！";
                label.style.color = "#00d2d3";
                curTitle.textContent = "🎉 すべての記事の原稿事前生成が完了しました！";
                startBtn.textContent = "▶️ 再生成";
                startBtn.style.display = "inline-flex";
                stopBtn.style.display = "none";
            } else {
                label.textContent = "📝 原稿事前生成: 待機中";
                label.style.color = "#81ecec";
                startBtn.textContent = "▶️ 一括生成";
                startBtn.style.display = "inline-flex";
                stopBtn.style.display = "none";
            }
        }

        if (window.NewsBatchGenerator) {
            window.NewsBatchGenerator.addListener((event, status) => {
                updateBatchGenUI(status);
            });
        }

        function handleBatchGenToggle() {
            if (!window.NewsBatchGenerator) return;
            const status = window.NewsBatchGenerator.getStatus();
            if (status.state === "running") {
                window.NewsBatchGenerator.pause();
            } else if (status.state === "paused") {
                window.NewsBatchGenerator.resume();
            } else {
                const items = getSortedNews();
                if (!items || items.length === 0) {
                    const curTitle = document.getElementById("batch-gen-current-title");
                    if (curTitle) curTitle.textContent = "⚠️ ニュース記事がありません。先に更新ボタンを押してください。";
                    return;
                }
                window.NewsBatchGenerator.start(items);
            }
        }

        function handleBatchGenStop() {
            if (!window.NewsBatchGenerator) return;
            window.NewsBatchGenerator.stop();
        }

        // ── ニュースキャッシュマネージャーを開く ──
        function handleOpenCacheViewer() {
            if (window.opener && typeof window.opener.openNewsCachePopup === "function") {
                window.opener.openNewsCachePopup();
            } else {
                const width = 960;
                const height = 750;
                const left = Math.max(0, (window.screen.width - width) / 2);
                const top = Math.max(0, (window.screen.height - height) / 2);
                window.open(
                    `/news_cache_viewer.html?t=${Date.now()}`,
                    "VStudioNewsCacheWindow",
                    `width=${width},height=${height},left=${left},top=${top},menubar=no,toolbar=no,location=no,status=no,resizable=yes`
                );
            }
        }
    </script>
</body>
