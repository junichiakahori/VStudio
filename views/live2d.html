<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Live2D Avatar Studio</title>
    <meta name="description" content="Live2Dモデルを使ったリアルタイムVTuberアバタースタジオ。">

    <link rel="stylesheet" href="/css/live2d-styles.css?v=3.7">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;500;700&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    <script>
        (function () {
            function getJSTTimestamp() {
                const d = new Date();
                const jstOffset = 9 * 60; // minutes
                const localOffset = d.getTimezoneOffset(); // minutes
                const jstTime = new Date(d.getTime() + (jstOffset + localOffset) * 60000);
                const pad = (n, len = 2) => String(n).padStart(len, '0');
                const yyyy = jstTime.getFullYear();
                const mm = pad(jstTime.getMonth() + 1);
                const dd = pad(jstTime.getDate());
                const hh = pad(jstTime.getHours());
                const min = pad(jstTime.getMinutes());
                const ss = pad(jstTime.getSeconds());
                const ms = pad(jstTime.getMilliseconds(), 3);
                return `${yyyy}-${mm}-${dd} ${hh}:${min}:${ss}.${ms}`;
            }

            // 📌 全スクリプトのクエリバージョン完全自動追跡エンジン
            function getScriptVersion(fileName) {
                try {
                    const scripts = document.querySelectorAll("script[src]");
                    for (let i = 0; i < scripts.length; i++) {
                        const src = scripts[i].getAttribute("src") || "";
                        if (src.includes(fileName)) {
                            const vMatch = src.match(/\?v=([a-zA-Z0-9_\.\-]+)/);
                            if (vMatch) return `?v=${vMatch[1]}`;
                        }
                    }
                } catch(e) {}
                return "";
            }

            function getCallerSource() {
                try {
                    const stack = (new Error()).stack || "";
                    const lines = stack.split("\n");
                    for (let i = 2; i < lines.length; i++) {
                        const line = lines[i];
                        if (!line || line.includes("live2d.html") && !line.includes("?v=")) continue;
                        const match = line.match(/([a-zA-Z0-9_\-]+\.(?:js|html))(?::(\d+))?/);
                        if (match) {
                            const fileName = match[1];
                            const lineNo = match[2] ? `:${match[2]}` : "";
                            const ver = getScriptVersion(fileName);
                            return `[${fileName}${ver}${lineNo}]`;
                        }
                    }
                } catch (e) { }
                return "";
            }

                                    // 🚨 スクリプト構文エラー・グローバル例外の完全捕捉エンジン
            window.onerror = function(msg, url, lineNo, columnNo, error) {
                const file = url ? url.split('/').pop() : 'unknown';
                const errStr = `[グローバル例外] 💥 ${file}:${lineNo}:${columnNo} -> ${msg}`;
                sendLogToServer('error', [errStr]);
                return false;
            };
            window.onunhandledrejection = function(event) {
                const reason = event.reason ? (event.reason.stack || event.reason.message || event.reason) : 'unknown rejection';
                sendLogToServer('error', [`[未処理Promise拒否] 💥 ${reason}`]);
            };

            function sendLogToServer(level, args) {
                try {
                    const message = args.map(arg => {
                        if (arg instanceof Error) return arg.stack || arg.message;
                        return typeof arg === 'object' ? JSON.stringify(arg) : String(arg);
                    }).join(' ').trim();
                    if (!message || message.includes("[CSM]") || message.includes("Google Identity Services loaded") || message.includes("Model positioned:")) return;
                    const timestamp = getJSTTimestamp();
                    const caller = getCallerSource();
                    const callerTag = caller ? ` ${caller}` : "";

                    // ポート番号(8443:本番ネイティブ / 8444:開発Safari)およびWKWebView nativeHostで完全判定
                    let clientType = "web";
                    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nativeHost) {
                        clientType = "native";
                    } else if (window.location.port === "8443") {
                        clientType = "native";
                    } else if (window.location.port === "8444") {
                        clientType = "web";
                    }

                    const isNative = (clientType === "native");
                    const clientTag = isNative ? "[🖥️ NATIVE]" : "[🧭 SAFARI]";
                    const logString = `[${timestamp}] ${clientTag}${callerTag} [${level.toUpperCase()}] ${message}`;

                    fetch('/log', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: logString, client: clientType }),
                        keepalive: true
                    }).catch(() => { });
                } catch (e) { }
            }

            const originalLog = console.log;
            const originalWarn = console.warn;
            const originalError = console.error;

            console.log = function (...args) {
                originalLog.apply(console, args);
                sendLogToServer('log', args);
            };
            console.warn = function (...args) {
                originalWarn.apply(console, args);
                sendLogToServer('warn', args);
            };
            console.error = function (...args) {
                originalError.apply(console, args);
                sendLogToServer('error', args);
            };
        })();

        // =====================================================================
        // 放送事故防止: ブラウザネイティブalert()の完全Toast化
        // 配信画面中央に被るダイアログを完全遮断し、右側コントロールパネル上部に安全表示
        // =====================================================================
        window.alert = function (message) {
            console.log(`[Notification] ${message}`);
            let toast = document.getElementById("vstudio-safe-toast");
            if (!toast) {
                toast = document.createElement("div");
                toast.id = "vstudio-safe-toast";
                toast.style.cssText = "position:fixed; top:12px; right:12px; z-index:999999; max-width:300px; background:linear-gradient(135deg, rgba(20,24,38,0.96), rgba(10,14,24,0.98)); border:1px solid rgba(0,243,255,0.6); border-radius:8px; padding:10px 14px; color:#fff; font-size:0.8rem; line-height:1.45; box-shadow:0 8px 24px rgba(0,0,0,0.7), 0 0 12px rgba(0,243,255,0.25); backdrop-filter:blur(10px); transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1); opacity:0; transform:translateY(-10px); pointer-events:auto; cursor:pointer; font-weight:500;";
                toast.onclick = () => { toast.style.opacity = "0"; toast.style.transform = "translateY(-10px)"; };
                document.body.appendChild(toast);
            }
            toast.textContent = String(message);
            toast.style.opacity = "1";
            toast.style.transform = "translateY(0)";
            if (window._toastTimeout) clearTimeout(window._toastTimeout);
            window._toastTimeout = setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transform = "translateY(-10px)";
            }, 3500);
        };

        // =====================================================================
                        // =====================================================================
        // ニュース番組 最優先グローバルエントリポイント (ゼロ遅延キュー完備)
        // =====================================================================
        window._pendingNewsBroadcast = null;
        window.startNewsBroadcast = function(startIndex = 0, items = null, isFromNewsList = false) {
            console.log(`[Live2D Main] 🚀 グローバル startNewsBroadcast 受信 (startIndex: ${startIndex})`);
            if (typeof window._executeNewsBroadcast === "function") {
                console.log("[Live2D Main] ⚡ _executeNewsBroadcast を即時実行します");
                return window._executeNewsBroadcast(startIndex, items, isFromNewsList);
            }
            console.log("[Live2D Main] ⏳ news-mode.js のロード待機キューに保存しました");
            window._pendingNewsBroadcast = { startIndex, items, isFromNewsList };
        };
        // UIイベント重複防止＆モジュール登録エンジン
        // =====================================================================
        window._uiLoadedHandlers = window._uiLoadedHandlers || new Map();
        window.onUILoaded = function (moduleId, handler) {
            window._uiLoadedHandlers.set(moduleId, handler);
        };
        window.addEventListener("uiLoaded", () => {
            window._uiLoadedHandlers.forEach((handler, id) => {
                try {
                    handler();
                } catch (e) {
                    console.error(`[UILoaded Error: ${id}]`, e);
                }
            });
        });
    </script>
</head>

<body>

            </div>
            <canvas id="live2d-canvas"></canvas>
            <!-- HTMLオーバーレイ群: Chrome GPU合成ちらつき防止のため独立レイヤー化 -->

                <!-- リアルタイム字幕テロップ（ドラッグ＆ドロップ可能） -->

                    <div class="subtitles-text" id="avatar-subtitles-text"></div>
                </div>
                <div class="comment-viewer" id="comment-viewer" style="pointer-events:auto;"></div>
                <div class="camera-preview-container" id="camera-preview-container" style="pointer-events:auto;">
