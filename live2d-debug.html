<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Live2D Debug</title>
<style>
body { background:#111; color:#0f0; font-family:monospace; padding:20px; }
#log { white-space:pre-wrap; font-size:12px; }
.err { color:#f44; }
.ok { color:#4f4; }
canvas { display:block; margin:20px 0; border:1px solid #333; }
</style>
</head>
<body>
<h2 style="color:#0ff">Live2D Debug Page</h2>
<canvas id="c" width="400" height="400"></canvas>
<div id="log"></div>

<script src="pixi.min.js"></script>
<script src="live2dcubismcore.min.js"></script>
<script src="pixi-live2d-display.min.js"></script>
<script>
const log = document.getElementById('log');
function ok(msg)  { log.innerHTML += `<span class="ok">[OK] ${msg}</span>\n`; console.log('[OK]', msg); }
function err(msg) { log.innerHTML += `<span class="err">[ERR] ${msg}</span>\n`; console.error('[ERR]', msg); }

// Step 1: Check PIXI
if (window.PIXI) ok('PIXI loaded: v' + PIXI.VERSION);
else { err('PIXI not found!'); }

// Step 2: Check Cubism Core
if (window.Live2DCubismCore) ok('Cubism Core loaded: ' + (Live2DCubismCore.Version ? Live2DCubismCore.Version.csmGetVersion() : 'version unknown'));
else err('Cubism Core not found! Live2DCubismCore is undefined');

// Step 3: Check pixi-live2d-display
if (window.PIXI && PIXI.live2d) ok('PIXI.live2d namespace found');
else err('PIXI.live2d namespace NOT found');

if (window.PIXI && PIXI.live2d && PIXI.live2d.Live2DModel) ok('PIXI.live2d.Live2DModel found');
else err('PIXI.live2d.Live2DModel NOT found');

// Step 4: Init PixiJS
let app;
try {
    app = new PIXI.Application({ view: document.getElementById('c'), width: 400, height: 400, backgroundAlpha: 0 });
    ok('PixiJS Application created');
} catch(e) { err('PixiJS init failed: ' + e.message); }

// Step 5: Register ticker
if (PIXI.live2d && PIXI.live2d.Live2DModel && app) {
    try {
        PIXI.live2d.Live2DModel.registerTicker(PIXI.Ticker);
        ok('Ticker registered');
    } catch(e) { err('Ticker registration failed: ' + e.message); }
}

// Step 6: Load model
async function testLoad() {
    const MODEL_PATH = 'Live2DModels/hiyori_vts/hiyori.model3.json';
    ok('Attempting to load: ' + MODEL_PATH);
    
    // First check if file is accessible
    try {
        const resp = await fetch(MODEL_PATH);
        if (resp.ok) ok('model3.json fetch OK (HTTP ' + resp.status + ')');
        else err('model3.json fetch failed: HTTP ' + resp.status);
        const json = await resp.json();
        ok('model3.json parsed: Moc=' + json.FileReferences.Moc);
        
        // Check if moc3 is accessible
        const mocPath = 'Live2DModels/hiyori_vts/' + json.FileReferences.Moc;
        const mocResp = await fetch(mocPath);
        if (mocResp.ok) ok('moc3 file fetch OK (HTTP ' + mocResp.status + ', size=' + mocResp.headers.get('content-length') + ')');
        else err('moc3 fetch failed: HTTP ' + mocResp.status);
    } catch(e) {
        err('File fetch error: ' + e.message);
    }
    
    // Load Live2D model
    if (!PIXI.live2d || !PIXI.live2d.Live2DModel) {
        err('Cannot load model - Live2DModel not available');
        return;
    }
    
    try {
        ok('Calling Live2DModel.from()...');
        const model = await PIXI.live2d.Live2DModel.from(MODEL_PATH, { autoInteract: false });
        ok('MODEL LOADED SUCCESSFULLY! internalModel exists: ' + !!model.internalModel);
        
        if (app) {
            app.stage.addChild(model);
            model.scale.set(0.3);
            model.x = 200;
            model.y = 200;
            ok('Model added to stage at scale 0.3');
        }
    } catch(e) {
        err('Live2DModel.from() failed: ' + e.message);
        err('Stack: ' + (e.stack || '').substring(0, 300));
    }
}

testLoad();
</script>
</body>
</html>
